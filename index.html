  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  body{background:#000d24;min-height:100vh;overflow:hidden}

    display:flex;
    align-items:center;
    justify-content:center;
    width:100vw;
    height:100vh;
    padding:40px;
  }

  svg#scene{

  }

  .gl  {stroke:#3a7aee;stroke-width:1.4;fill:none;opacity:0}
  .gd  {stroke:#3a7aee;stroke-width:1.4;fill:none;stroke-dasharray:4 2;opacity:0}
  .gc  {stroke:#3a7aee;stroke-width:1.1;fill:none;opacity:0}
  .cross{stroke:#ee8c1a;stroke-width:1.6;fill:none;opacity:0}
  .dot {fill:#4a8fff;opacity:0}

  /* Logo paths */
  .lp{
    fill:none;
    stroke:#7ab0ff;
    stroke-width:1.6;
    stroke-miterlimit:10;
    stroke-linejoin:round;
    stroke-linecap:round;
    opacity:0;
    transition: fill 0.6s ease, stroke 0.6s ease, stroke-width 0.6s ease;
  }
  .lp.filled{
    fill:#7ab0ff;
    stroke:none;
    stroke-width:0;
  }

  .noise{
    position:absolute;top:0;left:0;width:100%;height:100%;
    opacity:.02;pointer-events:none;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size:200px 200px;
  }

<script>
let running = false;
const wait = ms => new Promise(r => setTimeout(r, ms));
const q = s => [...document.querySelectorAll(s)];

/* ── easing functions ─────────────────────────────────────────────────── */
function easeInOut(t) {
  // smooth S-curve, no abrupt changes
  return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
}
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

/* ── fade helper ──────────────────────────────────────────────────────── */
function fadeTo(els, targetOp, dur, stagger = 0) {
  els.forEach((el, i) => setTimeout(() => {
    el.style.transition = `opacity ${dur}ms cubic-bezier(0.4,0,0.6,1)`;
    el.style.opacity = targetOp;
  }, i * stagger));
}

/* ── reset ────────────────────────────────────────────────────────────── */
function resetAll() {
  q('.gl,.gd').forEach(el => {
    el.style.transition = 'none'; el.style.opacity = '0';
  });
  // reset all cross lines including those inside groups
  q('#ch line').forEach(el => {
    el.style.transition = 'none'; el.style.opacity = '0';
  });
  q('.gc').forEach(el => {
    el.style.transition = 'none';
    el.style.strokeDasharray = '';
    el.style.strokeDashoffset = '';
    el.style.opacity = '0';
  });
  q('.lp').forEach(el => {
    el.style.transition = 'none';
    el.style.strokeDasharray = '';
    el.style.strokeDashoffset = '';
    el.style.opacity = '0';
    el.classList.remove('filled');
  });
  q('.dot').forEach(el => {
    el.style.transition = 'none';
    el.style.opacity = '0';
    el.setAttribute('r', '3');
  });
}

/* ── circle draw via CSS transition ──────────────────────────────────── */
function animCircle(el, delay) {
  const r    = parseFloat(el.getAttribute('r'));
  const circ = 2 * Math.PI * r;
  const dur  = 600 + r * 18;
  setTimeout(() => {
    el.style.strokeDasharray  = circ;
    el.style.strokeDashoffset = circ;
    el.style.opacity = '0.35';
    void el.getBoundingClientRect();
    el.style.transition = `stroke-dashoffset ${dur}ms cubic-bezier(0.4,0,0.6,1)`;
    el.style.strokeDashoffset = '0';
  }, delay);
}

/* ── dot pulse — crosshair fades out, dot appears in its place ────────── */
function pulseDot(id, delay) {
  const letter = id.replace('dot-', '');
  setTimeout(() => {
    // fade out the crosshair
    const cross = document.getElementById('cross-' + letter);
    if (cross) {
      cross.querySelectorAll('line').forEach(l => {
        l.style.transition = 'opacity 0.3s ease';
        l.style.opacity = '0';
      });
    }
    // show dot
    const dot = document.getElementById(id);
    if (!dot) return;
    dot.style.transition = 'opacity 0.2s ease';
    dot.style.opacity = '1';
    dot.setAttribute('r', '4');
    setTimeout(() => {
      dot.style.transition = 'opacity 0.5s ease';
      dot.style.opacity = '0.5';
      dot.setAttribute('r', '3');
    }, 300);
  }, delay);
}

/*
  ── drawPath via requestAnimationFrame ────────────────────────────────
  Draws the path in both directions simultaneously from startFrac.
  Uses rAF with manual interpolation — zero CSS transitions on the path,
  so there are NO cuts, NO re-triggers, NO flicker.

  The stroke trick:
    dasharray  = [fwd, gap, bwd, gap2]  — two independent segments
    We grow fwd (forward from startFrac) and bwd (backward from startFrac)
    each frame using dashoffset manipulation.

  Simpler equivalent used here:
    Two separate <path> clones drawn simultaneously:
      clone1: draws from startFrac → end
      clone2: draws from startFrac → 0  (reversed path)

  Actually simplest reliable approach:
    Use a single rAF loop that sets dasharray/dashoffset each frame
    to show exactly [0..t_bwd] + [startFrac..startFrac+t_fwd] of the path.
    SVG dasharray supports multiple values for this.
*/
function drawPath(el, startFrac, totalDur, delay) {
  setTimeout(() => {
    let len;
    try { len = el.getTotalLength(); } catch(e) { len = 1500; }

    const s = startFrac * len; // start offset in px

    el.style.opacity = '1';
    el.style.strokeDasharray  = '0 ' + len;
    el.style.strokeDashoffset = '0';

    let startTime = null;
    let rafId;

    function frame(ts) {
      if (!startTime) startTime = ts;
      const elapsed = ts - startTime;
      const t = Math.min(elapsed / totalDur, 1);
      const prog = easeInOut(t); // 0..1

      // forward segment: startFrac → end, grows by prog*(1-startFrac)*len
      const fwd = prog * (len - s);
      // backward segment: startFrac → 0, grows by prog*startFrac*len
      const bwd = prog * s;

      /*
        dasharray layout on the path (starting from position 0):
          [bwd]  visible  (0 → bwd)
          [s-bwd] gap     (bwd → s)
          [fwd]  visible  (s → s+fwd)
          [rest]  gap     (s+fwd → end)
        dashoffset = 0
      */
      const gap1 = s - bwd;
      const gap2 = len - s - fwd;

      el.style.strokeDasharray  =
        `${bwd} ${gap1 < 0 ? 0 : gap1} ${fwd} ${gap2 < 0 ? 0 : gap2}`;
      el.style.strokeDashoffset = '0';

      if (t < 1) {
        rafId = requestAnimationFrame(frame);
      } else {
        // fully drawn — clean up
        el.style.strokeDasharray  = '';
        el.style.strokeDashoffset = '';
      }
    }

    rafId = requestAnimationFrame(frame);
  }, delay);
}

/* ── main sequence ────────────────────────────────────────────────────── */
async function startAnimation() {
  if (running) return;
  running = true;
  resetAll();
  await wait(400);

  // Horizontal grid — staggered fade
  fadeTo(q('#hl line'), '0.38', 600, 55);
  await wait(800);

  // Vertical grid
  fadeTo(q('#vl line'), '0.38', 600, 35);
  await wait(850);

  // Crosshairs — fade in all cross lines
  fadeTo(q('#ch line'), '0.85', 300, 50);
  await wait(500);

  // Construction circles
  const circles = q('#cc circle');
  circles.forEach((el, i) => animCircle(el, i * 80));
  await wait(circles.length * 80 + 500);

  // ── Letters — rAF-driven, no cuts, faster ──
  const letters = [
    { ids: ['e3', 'e1', 'e2'], dot: 'dot-e', dur: 1000, gap: 120 },
    { ids: ['n1'],              dot: 'dot-n', dur: 1200, gap: 0   },
    { ids: ['i1'],              dot: 'dot-i', dur:  500, gap: 0   },
    { ids: ['g1'],              dot: 'dot-g', dur: 1200, gap: 0   },
    { ids: ['m1'],              dot: 'dot-m', dur: 1300, gap: 0   },
    { ids: ['a1'],              dot: 'dot-a', dur: 1300, gap: 0   },
  ];

  let cursor = 0;
  for (const letter of letters) {
    pulseDot(letter.dot, cursor);
    cursor += 180;

    letter.ids.forEach((id, pi) => {
      const el = document.getElementById(id);
      if (!el) return;
      const sf = parseFloat(el.dataset.start || '0');
      drawPath(el, sf, letter.dur, cursor + pi * letter.gap);
    });

    cursor += letter.dur + 180;
  }

  await wait(cursor + 300);

  // Brief pause — logo visible as outline with grid still showing
  await wait(400);

  // Swap outline → fill AND simultaneously fade out grid/circles/crosshairs/dots
  q('.lp').forEach(el => el.classList.add('filled'));
  fadeTo([...q('#hl line'), ...q('#vl line'), ...q('#ch line')], '0', 800);
  fadeTo(q('#cc circle'), '0', 800);
  fadeTo(q('.dot'), '0', 400);

  // Hold filled logo for 4s
  await wait(4000);

  // Slow fade-out of everything before loop restarts
  fadeTo(q('.lp'), '0', 1200);
  await wait(1300);

  running = false;
  startAnimation();
  startAnimation();
}

window.addEventListener('load', () => setTimeout(startAnimation, 600));
</script>
</body>
